# Flat table for RL oneshot/obstacle setup: place cubes, free paddle and puck.
# Puck spawns at center with zero velocity. Use script play_flat_table.py to place blocks with clicks.
air_hockey:
  simulator_params:
    absorb_target: false
    block_width: 0.07
    force_scaling: 1000
    gravity: 0
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 2500
    paddle_radius: 0.0508
    puck_radius: 0.03175
    puck_damping: 0.5
    puck_density: 250
    block_density: 500
    render_size: 360
    width: 0.8636
    open_goal_wall: true
    goal_width: 0.30

  num_paddles: 1
  num_pucks: 1
  num_blocks: 0
  num_obstacles: 0
  num_targets: 0
  simulator: box2d
  max_timesteps: 10000
  task: flat_table

  # Full-table paddle bounds so you can move past the center and avoid obstacles
  # [x_min, x_max, y_min, y_max] in table coords (length=1.93, width=0.86)
  paddle_bounds: [-0.86, 0.86, -0.33, 0.33]

  goal_max_x_velocity: 1
  goal_min_y_velocity: 1
  goal_max_y_velocity: 5

  terminate_on_out_of_bounds: true
  terminate_on_enemy_goal: false
  terminate_on_puck_stop: false
  truncate_rew: 0
  wall_bumping_rew: 0
  direction_change_rew: 0
  horizontal_vel_rew: 0
  diagonal_motion_rew: 0
  stand_still_rew: 0

n_training_steps: 1
seed: 0
print_reward: false
